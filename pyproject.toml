[project]
name = "lashos-knowledge-engine"
version = "0.1.0"
description = "Knowledge extraction and knowledge graph engine for the lash industry — the foundation of LashOS."
# 3.11 is the real floor (StrEnum). Requiring 3.12 would block the pilot on a stock
# machine for no reason — the suite runs green on 3.11.
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # core
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "structlog>=24.4",
    "tenacity>=9.0",
    "blake3>=0.4",

    # data
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",

    # pipeline
    "prefect>=3.0",
    "redis>=5.1",

    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",

    # content
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "webvtt-py>=0.5",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3.10",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
]

[project.scripts]
lke = "lashos_ke.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lashos_ke"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# Strict typing is enforced where correctness is structural: the data model and
# the shared core. Pipeline stages that marshal LLM output are checked less
# aggressively because their real contract is the JSON Schema, not the type system.
files = ["src/lashos_ke/models", "src/lashos_ke/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a real Postgres (testcontainers)",
    "llm: makes live model calls",
]
